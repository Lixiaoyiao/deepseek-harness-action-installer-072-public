# Generated by create-deepseek-harness-action.
# SECURITY: pull_request_target can access secrets and a privileged token. This
# workflow checks out only the trusted base/default branch and never executes fork code.
name: DSH review

on:
  pull_request_target:
    types: [ opened, synchronize, ready_for_review, reopened ]
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: dsh-${{ github.event_name == 'pull_request_target' && 'review' || 'chat' }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  review:
    if: >- #dsh-allowed-actors:v1
      ${{ ((github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) || (github.event.sender.type != 'Bot' && contains(github.event.comment.body || github.event.review.body, '@dsh'))) && (((contains(fromJSON('["fixture-observer","fixture-observer[bot]"]'), github.actor)) && (github.event_name != 'workflow_run' || ((!github.event.workflow_run.actor.login || (contains(fromJSON('["fixture-observer","fixture-observer[bot]"]'), github.event.workflow_run.actor.login))) && (!github.event.workflow_run.triggering_actor.login || (contains(fromJSON('["fixture-observer","fixture-observer[bot]"]'), github.event.workflow_run.triggering_actor.login))))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted base or default branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: Lixiaoyiao/deepseek-harness-action@23a998ccd209f5422f220f038234a89984f0471c
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          dsh-version: 0.2.1-rc.2
          permission-profile: strict
          isolation: docker
          natural-language-write: "false"
          allow-write: "false"
          allowed-actors: fixture-observer
